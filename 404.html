<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | Design Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20260818a">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <style>
        .error-shell { min-height: 100vh; display: flex; flex-direction: column; }
        .error-main { flex: 1; display: grid; place-items: center; padding: 64px 0 96px; text-align: center; }
        .error-card { width: min(100%, 580px); }
        .error-code { color: var(--teal-dark); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
        .error-title { margin-top: 18px; font-size: clamp(38px, 6vw, 58px); line-height: 1.02; }
        .error-copy { max-width: 460px; margin: 20px auto 0; font-size: 17px; line-height: 1.65; }
        .error-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }
        @media (max-width: 560px) {
            .site-header { padding: 20px 0; }
            .brand-logo { height: 44px; }
            .error-main { padding: 48px 0 72px; }
            .error-actions { align-items: stretch; flex-direction: column; }
            .error-actions .btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="error-shell">
    <header class="site-header">
        <div class="container">
            <a href="/" class="brand" aria-label="Design Sync home">
                <img src="/assets/logo.png" alt="Design Sync" class="brand-logo">
            </a>
            <a href="https://app.trydesignsync.com/login" class="btn btn-ghost header-account" data-account-link>Log in</a>
        </div>
    </header>

    <main class="error-main">
        <div class="container">
            <div class="error-card">
                <p class="error-code">Error 404</p>
                <h1 class="error-title">This page isn’t here.</h1>
                <p class="error-copy">The address may be incorrect, or the page may have moved. You can return to our design work or start with a plan.</p>
                <div class="error-actions">
                    <a href="/" class="btn btn-dark">Back to designs</a>
                    <a href="https://app.trydesignsync.com/start" class="btn btn-ghost">View design plans</a>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="/js/main.js?v=20260818a"></script>
</body>
</html>
