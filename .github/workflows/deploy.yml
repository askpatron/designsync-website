name: Validate

# Native marketing production and staging live on 104.207.75.124.
# This workflow never SSHs and never deploys Docker.
# Owner deploys from the VPS using DEPLOYMENT.md (git checkout + rsync).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: designsync-website-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this workflow cannot deploy
        run: |
          set -euo pipefail
          echo "Validation only. No remote deploy."
          ruby -ryaml -e '
            wf = YAML.load_file(".github/workflows/deploy.yml")
            wf.fetch("jobs").each do |_name, job|
              Array(job["steps"]).each do |step|
                next if step["name"] == "Confirm this workflow cannot deploy"
                run = step["run"].to_s
                abort "SSH deploy is forbidden" if run.match?(/ssh-keyscan|~\/.ssh\/deploy_key|StrictHostKeyChecking/)
                abort "ssh deploy commands are forbidden" if run.match?(/\bssh\s+-/)
                abort "docker compose up is forbidden" if run.match?(/docker\s+compose\s+.*\bup\b/)
                abort "piped remote deploy is forbidden" if run.match?(/bash\s+-s\s+</)
              end
            end
          '

      - name: Validate workflow YAML
        run: ruby -ryaml -e "YAML.load_file('.github/workflows/deploy.yml')"

      - name: Confirm remote Docker deploy script is disabled
        run: |
          set -euo pipefail
          bash -n .github/scripts/remote-deploy.sh
          if bash .github/scripts/remote-deploy.sh; then
            echo "remote-deploy.sh must refuse to run." >&2
            exit 1
          fi
